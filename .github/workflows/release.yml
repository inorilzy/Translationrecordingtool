name: Release

# Push a tag such as v0.4.0 to build Windows + macOS packages and publish them
# to the matching GitHub Release. Can also be started manually for a dry run
# (artifacts are uploaded to the workflow run, no Release is created).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            build: npm run tauri:build:ocr:win
            artifacts: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
          - name: macos-aarch64
            os: macos-14
            build: npm run tauri:build:ocr:mac
            artifacts: |
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/bundle/dmg/*-portable.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Cache dictionary inputs
        uses: actions/cache@v4
        with:
          path: .cache/dictionary
          key: dictionary-inputs-v1

      - name: Install npm dependencies
        run: npm ci

      - name: Build offline dictionary
        run: npm run build:dictionary

      - name: Build and package
        run: ${{ matrix.build }}

      - uses: actions/upload-artifact@v4
        with:
          name: translation-tool-${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true

      - name: List release files
        run: ls -lh dist-release

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist-release/*
